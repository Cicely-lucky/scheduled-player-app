name: Build APK

# 云端打包：把代码推到 GitHub 后自动构建出安卓安装包（APK）
# 触发方式：
#   1. 推送到 main 分支自动触发
#   2. 手动触发：仓库 Actions 页面 → 选中本工作流 → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'
          cache: true

      - name: 生成安卓脚手架（保留自定义的 AndroidManifest.xml）
        run: |
          flutter create --platforms=android --project-name scheduled_player_app .
          rm -rf test

      # flutter create 默认 applicationId/namespace = com.example.scheduled_player_app
      # （项目名下划线会被拼进去）。本应用对外使用 com.cici.scheduledplayer，
      # 故在 create 之后、Kotlin 编译之前批量改写。
      - name: 重写 applicationId 与 namespace 为 com.cici.scheduledplayer
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/com\.example\.scheduled_player_app/com.cici.scheduledplayer/g' "$f"
          done
          echo "--- applicationId / namespace ---"
          grep -E 'applicationId|namespace' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -5

      - name: 提升 compileSdk 到 35（部分插件要求）
        run: |
          sed -i -E 's/(compileSdk(Version)?)( =)? flutter\.compileSdkVersion/\1\2 = 35/' android/app/build.gradle
          sed -i -E 's/(compileSdk(Version)?)( =)? flutter\.compileSdkVersion/\1\2 = 35/' android/app/build.gradle.kts 2>/dev/null || true
          grep -rn 'compileSdk' android/app/ || true

      - name: 启用 core library desugaring（flutter_local_notifications 要求）
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          # 1) 在 compileOptions 内启用 desugaring（仅当尚未启用时）
          if 'coreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_1_8\n        coreLibraryDesugaringEnabled true')
          # 2) 追加 desugar 依赖（判断条件用 desugar_jdk_libs，避免与上面的开关关键词混淆）
          if 'desugar_jdk_libs' not in s:
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
          open(p, 'w').write(s)
          print('--- desugaring config ---')
          print(open(p).read())
          EOF

      - name: 关闭代码混淆与资源压缩（防止通知资源被改名导致通知静默失败）
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          # 在文件末尾追加覆盖配置：release 构建不做代码混淆/资源压缩。
          # 原因：资源压缩器会把 @mipmap/ic_launcher 等资源改名，
          # flutter_local_notifications 按名字查图标会返回 0，
          # 通知静默失败（官方 README 明确警告过此坑）。
          # 个人自用 App，包体变大无所谓，稳定性优先。
          if 'minifyEnabled' not in s:
              s += (
                  "\nandroid {\n"
                  "    buildTypes {\n"
                  "        release {\n"
                  "            minifyEnabled false\n"
                  "            shrinkResources false\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
          open(p, 'w').write(s)
          print('--- tail of build.gradle ---')
          print(s[-400:])
          EOF

      - name: 安装依赖
        run: flutter pub get

      # 签名密钥缓存：flutter 模板默认用 debug keystore 签 release，
      # 而 ubuntu runner 每次全新、无 ~/.android/debug.keystore 时会自动
      # 生成一个随机 key —— 导致每次构建签名都不同，手机上只能卸载重装
      # （任务数据与权限全丢）。用 actions/cache 把密钥缓存起来，之后所有
      # 构建共用同一签名，可 adb install -r 覆盖安装，数据与权限保留。
      - name: 缓存签名密钥（保证多次构建同一签名）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 生成签名密钥（仅首次无缓存时执行）
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            # runner 上 ~/.android 目录可能不存在，keytool 写文件会失败
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "--- first-run: new signing key generated ---"
          else
            echo "--- cached signing key reused ---"
          fi
          ls -la "$HOME/.android/"

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
