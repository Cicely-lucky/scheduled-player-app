name: Build APK

# 云端打包：把代码推到 GitHub 后自动构建出安卓安装包（APK）
# 触发方式：
#   1. 推送到 main 分支自动触发
#   2. 手动触发：仓库 Actions 页面 → 选中本工作流 → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'
          cache: true

      - name: 生成安卓脚手架（保留自定义的 AndroidManifest.xml）
        run: |
          flutter create --platforms=android --project-name scheduled_player_app .
          rm -rf test

      # flutter create 默认 applicationId/namespace = com.example.scheduled_player_app
      # （项目名下划线会被拼进去）。本应用对外使用 com.cici.scheduledplayer，
      # 故在 create 之后、Kotlin 编译之前批量改写。
      - name: 重写 applicationId 与 namespace 为 com.cici.scheduledplayer
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/com\.example\.scheduled_player_app/com.cici.scheduledplayer/g' "$f"
          done
          echo "--- applicationId / namespace ---"
          grep -E 'applicationId|namespace' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -5

      - name: 提升 compileSdk 到 35（部分插件要求）
        run: |
          sed -i -E 's/(compileSdk(Version)?)( =)? flutter\.compileSdkVersion/\1\2 = 35/' android/app/build.gradle
          sed -i -E 's/(compileSdk(Version)?)( =)? flutter\.compileSdkVersion/\1\2 = 35/' android/app/build.gradle.kts 2>/dev/null || true
          grep -rn 'compileSdk' android/app/ || true

      - name: 启用 core library desugaring（flutter_local_notifications 要求）
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          # 1) 在 compileOptions 内启用 desugaring（仅当尚未启用时）
          if 'coreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_1_8\n        coreLibraryDesugaringEnabled true')
          # 2) 追加 desugar 依赖（判断条件用 desugar_jdk_libs，避免与上面的开关关键词混淆）
          if 'desugar_jdk_libs' not in s:
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
          open(p, 'w').write(s)
          print('--- desugaring config ---')
          print(open(p).read())
          EOF

      - name: 关闭代码混淆与资源压缩（防止通知资源被改名导致通知静默失败）
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          # 在文件末尾追加覆盖配置：release 构建不做代码混淆/资源压缩。
          # 原因：资源压缩器会把 @mipmap/ic_launcher 等资源改名，
          # flutter_local_notifications 按名字查图标会返回 0，
          # 通知静默失败（官方 README 明确警告过此坑）。
          # 个人自用 App，包体变大无所谓，稳定性优先。
          if 'minifyEnabled' not in s:
              s += (
                  "\nandroid {\n"
                  "    buildTypes {\n"
                  "        release {\n"
                  "            minifyEnabled false\n"
                  "            shrinkResources false\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
          open(p, 'w').write(s)
          print('--- tail of build.gradle ---')
          print(s[-400:])
          EOF

      - name: 生成并替换应用图标
        run: |
          pip install Pillow -q
          python3 - <<'PYEOF'
          from PIL import Image
          import os

          src = 'assets/logo/logo_1024.png'
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          base = 'android/app/src/main/res/'
          img = Image.open(src).convert('RGBA')
          for folder, size in sizes.items():
              out_dir = os.path.join(base, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'))
          # 删除自适应图标目录，避免系统优先使用 flutter create 默认 xml
          anydpi = os.path.join(base, 'mipmap-anydpi-v26')
          if os.path.isdir(anydpi):
              import shutil
              shutil.rmtree(anydpi)
              print('removed default mipmap-anydpi-v26')
          print('--- launcher icons generated ---')
          PYEOF

      - name: 安装依赖
        run: flutter pub get

      # 签名背景：flutter 模板默认用 debug keystore 签 release，而 runner 每次全新，
      # 没有固定密钥时每次构建签名都不同，手机只能卸载重装（数据与权限全丢）。
      #
      # 方案（2026-10-15 定稿，显式签名三步走）：
      #   1) 密钥从 Secret 解码到项目目录 android/app/fixed-release.keystore
      #   2) build.gradle 显式声明 signingConfigs.release 的 storeFile 指向该文件
      #   3) 构建完成后校验 APK 证书指纹，不符直接失败（绝不静默换钥匙）
      # 血泪教训：早期「写入 ~/.android/debug.keystore 等 AGP 隐式采用」不生效——
      # flutter create 现场生成的模板 build.gradle 走 AGP 隐式路径解析，与写入
      # 位置脱节，APK 证书仍是 CN=Android Debug 随机生成。显式 storeFile 才可控。
      - name: 从 Secret 还原签名密钥到项目目录（永久固定签名）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "--- KS_B64 length: ${#KS_B64} ---"
          if [ -z "$KS_B64" ]; then
            echo "!!! FATAL: Secret ANDROID_KEYSTORE_BASE64 为空 !!!"
            echo "!!! 拒绝静默换钥匙，构建直接失败。请先运行「一键固定签名.bat」配置 Secret !!!"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > android/app/fixed-release.keystore
          # 解码结果必须是 keytool 能读的 keystore（storepass=android，alias=androiddebugkey）
          keytool -list -keystore android/app/fixed-release.keystore -storepass android 2>&1 | head -6
          echo "--- permanent keystore restored into project dir ---"

      - name: 配置 release 签名显式指向固定密钥（改写 build.gradle）
        # 姿势要点（Run #42 失败教训）：Groovy 按顺序求值，
        # signingConfigs.release 必须声明在 buildTypes 引用它之前；
        # 「文件末尾追加 android{} 块」会让模板处的引用变成悬空引用，
        # Gradle 配置阶段直接抛 unknown property 'release'。
        run: |
          python3 - <<'EOF'
          import os

          groovy = 'android/app/build.gradle'
          kts    = 'android/app/build.gradle.kts'

          if os.path.exists(groovy):
              s = open(groovy).read()
              if 'fixed-release.keystore' not in s:
                  # 插入位置：buildTypes 之前（先声明，后引用）
                  sig_block = (
                      "    signingConfigs {\n"
                      "        release {\n"
                      "            storeFile file('fixed-release.keystore')\n"
                      "            storePassword 'android'\n"
                      "            keyAlias 'androiddebugkey'\n"
                      "            keyPassword 'android'\n"
                      "        }\n"
                      "    }\n\n"
                  )
                  anchor = s.find('    buildTypes {')
                  if anchor < 0:
                      raise SystemExit('!! build.gradle 中找不到 buildTypes 锚点，拒绝静默换钥匙')
                  s = s[:anchor] + sig_block + s[anchor:]
                  # 声明已在前方，现在替换引用才安全
                  if 'signingConfig = signingConfigs.debug' in s:
                      s = s.replace('signingConfig = signingConfigs.debug',
                                    'signingConfig = signingConfigs.release')
                  else:
                      raise SystemExit('!! build.gradle 中未找到 debug 签名引用，拒绝静默换钥匙')
                  open(groovy, 'w').write(s)
              s = open(groovy).read()
              print('--- groovy build.gradle signing ---')
              i = s.find('signingConfigs')
              if i >= 0:
                  print(s[i:i + 420])

          if os.path.exists(kts):
              s = open(kts).read()
              if 'fixed-release.keystore' not in s:
                  sig_block = (
                      "    signingConfigs {\n"
                      "        create(\"release\") {\n"
                      "            storeFile = file(\"fixed-release.keystore\")\n"
                      "            storePassword = \"android\"\n"
                      "            keyAlias = \"androiddebugkey\"\n"
                      "            keyPassword = \"android\"\n"
                      "        }\n"
                      "    }\n\n"
                  )
                  anchor = s.find('buildTypes')
                  if anchor < 0:
                      raise SystemExit('!! build.gradle.kts 中找不到 buildTypes 锚点，拒绝静默换钥匙')
                  s = s[:anchor] + sig_block + s[anchor:]
                  if 'signingConfig = signingConfigs.debug' in s:
                      s = s.replace('signingConfig = signingConfigs.debug',
                                    'signingConfig = signingConfigs.getByName(\"release\")')
                  else:
                      raise SystemExit('!! build.gradle.kts 中未找到 debug 签名引用，拒绝静默换钥匙')
                  open(kts, 'w').write(s)
              s = open(kts).read()
              print('--- kts build.gradle.kts signing ---')
              i = s.find('signingConfigs')
              if i >= 0:
                  print(s[i:i + 420])
          EOF

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 验证 APK 签名指纹（不符则构建失败，绝不静默交付错签名）
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/^SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK 证书 SHA256 : $FP"
          echo "期望     SHA256 : b18d133f3384154e578a27dfdde14d1fe8b9fe981ce84d055e864ff5ba54c49d"
          if [ "$FP" != "b18d133f3384154e578a27dfdde14d1fe8b9fe981ce84d055e864ff5ba54c49d" ]; then
            echo "!!! APK 签名指纹不符，构建失败 !!!"
            exit 1
          fi
          echo "=== APK 签名验证通过（永久密钥已生效）==="

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
