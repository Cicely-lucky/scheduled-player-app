name: Build APK

# 云端打包：把代码推到 GitHub 后自动构建出安卓安装包（APK）
# 触发方式：
#   1. 推送到 main 分支自动触发
#   2. 手动触发：仓库 Actions 页面 → 选中本工作流 → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'
          cache: true

      - name: 生成安卓脚手架（保留自定义的 AndroidManifest.xml）
        run: |
          flutter create --platforms=android --project-name scheduled_player_app .
          rm -rf test

      - name: 提升 compileSdk 到 35（部分插件要求）
        run: |
          sed -i -E 's/(compileSdk(Version)?)( =)? flutter\.compileSdkVersion/\1\2 = 35/' android/app/build.gradle
          sed -i -E 's/(compileSdk(Version)?)( =)? flutter\.compileSdkVersion/\1\2 = 35/' android/app/build.gradle.kts 2>/dev/null || true
          grep -rn 'compileSdk' android/app/ || true

      - name: 启用 core library desugaring（flutter_local_notifications 要求）
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          # 1) 在 compileOptions 内启用 desugaring（仅当尚未启用时）
          if 'coreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_1_8\n        coreLibraryDesugaringEnabled true')
          # 2) 追加 desugar 依赖（判断条件用 desugar_jdk_libs，避免与上面的开关关键词混淆）
          if 'desugar_jdk_libs' not in s:
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
          open(p, 'w').write(s)
          print('--- desugaring config ---')
          print(open(p).read())
          EOF

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
