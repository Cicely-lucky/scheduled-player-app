<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小云工具 · B站 BV 号拼接</title>
  <style>
    :root {
      --primary: #38BDF8;
      --primary-dark: #0EA5E9;
      --bg: #E8F6FC;
      --card: #FFFFFF;
      --text: #1F2937;
      --text-secondary: #6B7280;
      --border: #E5E7EB;
      --success: #10B981;
      --error: #EF4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 8px 0;
    }

    .cloud {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #BAE6FD 0%, var(--primary) 100%);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(56,189,248,0.25);
    }

    .cloud svg {
      width: 20px;
      height: 20px;
      transform: rotate(45deg);
      fill: #FFFFFF;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    .hint {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    textarea, input[type="text"] {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
      font-family: inherit;
      color: var(--text);
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }

    textarea::placeholder, input::placeholder {
      color: #9CA3AF;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      margin-top: 12px;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(56,189,248,0.35);
    }

    .btn-secondary {
      background: #F3F4F6;
      color: var(--text);
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .link-row {
      background: #F0F9FF;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #E0F2FE;
    }

    .link-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link-value {
      font-size: 14px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.5;
      font-family: "SF Mono", Consolas, "PingFang SC", monospace;
    }

    .copy-btn {
      font-size: 12px;
      color: var(--primary-dark);
      background: transparent;
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .copy-btn:active { background: #E0F2FE; }

    .open-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .open-row .btn {
      margin-top: 0;
      flex: 1;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: var(--success);
      margin-top: 10px;
      min-height: 20px;
    }

    .status.error {
      color: var(--error);
    }

    .tips {
      background: #FFFBEB;
      border-radius: 14px;
      padding: 14px;
      font-size: 13px;
      color: #92400E;
      line-height: 1.6;
    }

    .tips strong {
      color: #78350F;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app-bar">
    <div class="cloud">
      <svg viewBox="0 0 24 24"><path d="M12 2C7.5 2 4 5.5 4 9.5c0 .5.05 1 .15 1.5C2.32 11.55 1 13.2 1 15.2 1 18 3.2 20 6 20h12c2.76 0 5-2.24 5-5 0-2.3-1.55-4.23-3.68-4.8.1-.5.15-1 .15-1.5C19.5 5.5 16 2 12 2z"/></svg>
    </div>
    <div class="title">小云工具 · B站 BV 号拼接</div>
  </div>

  <div class="card">
    <div class="section-title">输入</div>
    <div class="hint">粘贴 BV 号（如 BV1DvGqzTExT）或任意 B 站链接，工具会自动提取 BV 号。</div>
    <textarea id="input" rows="3" placeholder="在这里粘贴..."></textarea>
    <button class="btn btn-primary" id="generateBtn">一键拼接链接</button>
    <button class="btn btn-secondary" id="clearBtn">清空</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card result" id="result">
    <div class="section-title">结果</div>

    <div class="link-row">
      <div class="link-label">
        <span>B站完整长链接（推荐给小云闹钟）</span>
        <button class="copy-btn" data-target="longLink">复制</button>
      </div>
      <div class="link-value" id="longLink"></div>
    </div>

    <div class="link-row">
      <div class="link-label">
        <span>B站 App 深链</span>
        <button class="copy-btn" data-target="deepLink">复制</button>
      </div>
      <div class="link-value" id="deepLink"></div>
    </div>

    <div class="link-row">
      <div class="link-label">
        <span>分享短链格式</span>
        <button class="copy-btn" data-target="shortLink">复制</button>
      </div>
      <div class="link-value" id="shortLink"></div>
    </div>

    <div class="open-row">
      <button class="btn btn-secondary" id="openBtn">浏览器打开</button>
      <button class="btn btn-primary" id="copyAllBtn">复制全部</button>
    </div>
  </div>

  <div class="card tips">
    <strong>使用提示</strong><br>
    1. 在 B 站 App 视频简介中找到 BV 号，长按复制；<br>
    2. 回到本工具粘贴后点「一键拼接链接」；<br>
    3. 点长链接右侧「复制」，粘贴到小云闹钟的「新建任务 → 播放内容 → 网址」即可。
  </div>

  <script>
    const inputEl = document.getElementById('input');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultEl = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const longLinkEl = document.getElementById('longLink');
    const deepLinkEl = document.getElementById('deepLink');
    const shortLinkEl = document.getElementById('shortLink');
    const openBtn = document.getElementById('openBtn');
    const copyAllBtn = document.getElementById('copyAllBtn');

    const BV_RE = /BV[0-9A-Za-z]+/;
    const BV_EXACT_RE = /^BV[0-9A-Za-z]+$/;

    function extractBv(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return null;
      // 如果整段就是 BV 号
      if (BV_EXACT_RE.test(trimmed)) return trimmed;
      // 从链接或混合文本中提取
      const m = trimmed.match(BV_RE);
      return m ? m[0] : null;
    }

    function showStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', !!isError);
      if (!isError) {
        setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 2500);
      }
    }

    function generate() {
      const raw = inputEl.value;
      const bv = extractBv(raw);
      if (!bv) {
        showStatus('未识别到 BV 号，请粘贴正确的 BV 号或 B 站链接', true);
        resultEl.classList.remove('show');
        return;
      }

      const longLink = `https://www.bilibili.com/video/${bv}`;
      const deepLink = `bilibili://video/${bv}`;
      const shortLink = `https://b23.tv/${bv}`;

      longLinkEl.textContent = longLink;
      deepLinkEl.textContent = deepLink;
      shortLinkEl.textContent = shortLink;
      resultEl.classList.add('show');

      showStatus(`已提取 BV 号：${bv}`);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showStatus('已复制到剪贴板');
      } catch (e) {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showStatus('已复制到剪贴板');
      }
    }

    generateBtn.addEventListener('click', generate);

    clearBtn.addEventListener('click', () => {
      inputEl.value = '';
      resultEl.classList.remove('show');
      statusEl.textContent = '';
      inputEl.focus();
    });

    inputEl.addEventListener('paste', () => {
      // 粘贴后稍等 DOM 更新再执行
      setTimeout(generate, 50);
    });

    inputEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
    });

    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        copyText(target.textContent.trim());
      });
    });

    openBtn.addEventListener('click', () => {
      const url = longLinkEl.textContent.trim();
      if (url) window.open(url, '_blank');
    });

    copyAllBtn.addEventListener('click', () => {
      const text = [
        `B站完整长链接：${longLinkEl.textContent.trim()}`,
        `B站 App 深链：${deepLinkEl.textContent.trim()}`,
        `分享短链格式：${shortLinkEl.textContent.trim()}`
      ].join('\n');
      copyText(text);
    });
  </script>
</body>
</html>
