<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建任务</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 390px; height: 760px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; background: #F1F5F9; }
.phone { width: 390px; height: 760px; background: #E8F6FC; border-radius: 44px; overflow: hidden; position: relative; border: 8px solid #fff; box-shadow: 0 24px 60px rgba(15,23,42,0.18); }
.screen { width: 374px; height: 744px; overflow-y: auto; padding: 20px 14px 100px; position: relative; }
.appbar { display: flex; align-items: center; justify-content: center; height: 52px; position: relative; margin-bottom: 10px; }
.appbar-title { font-size: 17px; font-weight: 700; color: #0F172A; }
.appbar-back { position: absolute; left: 0; font-size: 18px; color: #0F172A; }
.card { background: #fff; border-radius: 14px; border: 1px solid #E2E8F0; padding: 14px; margin-bottom: 12px; }
.card-title { font-size: 14px; font-weight: 700; color: #0F172A; margin-bottom: 12px; }
.input { width: 100%; height: 40px; border: 1px solid #CBD5E1; border-radius: 8px; padding: 0 10px; font-size: 14px; color: #0F172A; display: flex; align-items: center; }
.input::placeholder { color: #94A3B8; }
.row-tap { width: 100%; background: #F1F5F9; border-radius: 10px; padding: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #0F172A; }
.row-tap span { margin-left: 8px; }
.row-tap .arrow { margin-left: auto; color: #94A3B8; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1px solid #CBD5E1; font-size: 13px; color: #64748B; background: #fff; }
.chip.active { background: #38BDF8; color: #fff; border-color: #38BDF8; }
.weeks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.week { width: 40px; height: 36px; border-radius: 10px; border: 1px solid #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #64748B; background: #fff; }
.week.active { background: #38BDF8; color: #fff; border-color: #38BDF8; }
.radio-row { border: 1px solid #CBD5E1; border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; align-items: flex-start; }
.radio-row.selected { border-color: #6366F1; background: rgba(99,102,241,0.05); }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #94A3B8; margin-right: 10px; flex-shrink: 0; margin-top: 2px; }
.radio.selected { border-color: #6366F1; background: #6366F1; box-shadow: inset 0 0 0 3px #fff; }
.radio-text { flex: 1; }
.radio-title { font-size: 13.5px; font-weight: 600; color: #0F172A; }
.radio-desc { font-size: 11.5px; color: #64748B; margin-top: 2px; }
.stepper { display: flex; align-items: center; }
.stepper-btn { width: 28px; height: 28px; background: #E2E8F0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #0F172A; }
.stepper-val { width: 28px; text-align: center; font-size: 15px; font-weight: 700; color: #0F172A; }
.stepper-unit { font-size: 12px; color: #64748B; margin-left: 6px; }
.switch-row { display: flex; align-items: center; margin-top: 10px; }
.switch-row .icon { font-size: 18px; margin-right: 6px; }
.switch-row .label { flex: 1; font-size: 14px; font-weight: 600; color: #0F172A; }
.toggle { width: 44px; height: 24px; background: rgba(56,189,248,0.35); border-radius: 12px; position: relative; }
.toggle::after { content:''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; background: #38BDF8; border-radius: 50%; }
.hint { font-size: 12px; color: #64748B; margin-top: 4px; padding-left: 24px; }
.bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px; background: #E8F6FC; display: flex; gap: 12px; }
.btn { flex: 1; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
.btn-cancel { background: #fff; border: 1px solid #CBD5E1; color: #0F172A; }
.btn-save { background: #38BDF8; color: #fff; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="appbar">
      <span class="appbar-back">←</span>
      <span class="appbar-title">新建任务</span>
    </div>
    <div class="card">
      <div class="card-title">任务名称</div>
      <div class="input" style="color:#94A3B8">如：早读铃声</div>
    </div>
    <div class="card">
      <div class="card-title">触发时间</div>
      <div class="row-tap">⏱<span>08:00 触发</span><span class="arrow">›</span></div>
    </div>
    <div class="card">
      <div class="card-title">频次</div>
      <div class="chips">
        <div class="chip active">每天</div>
        <div class="chip">每周</div>
        <div class="chip">特定日期</div>
      </div>
      <div class="weeks">
        <div class="week active">周一</div>
        <div class="week active">周二</div>
        <div class="week active">周三</div>
        <div class="week active">周四</div>
        <div class="week active">周五</div>
        <div class="week">周六</div>
        <div class="week">周日</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">播放内容</div>
      <div class="chips">
        <div class="chip active">打开网址</div>
        <div class="chip">导入音视频文件</div>
      </div>
      <div class="input" style="margin-top:12px;color:#94A3B8">https:// 或 http://</div>
    </div>
    <div class="card">
      <div class="card-title">停止设置</div>
      <div class="radio-row selected">
        <div class="radio selected"></div>
        <div class="radio-text">
          <div class="radio-title">循环 N 次后停止</div>
          <div class="radio-desc">按设定次数循环播放，播完自动停止</div>
        </div>
        <div class="stepper"><div class="stepper-btn">−</div><div class="stepper-val">1</div><div class="stepper-btn">+</div><span class="stepper-unit">次</span></div>
      </div>
      <div class="radio-row">
        <div class="radio"></div>
        <div class="radio-text">
          <div class="radio-title">播放 N 分钟后停止</div>
          <div class="radio-desc">到设定时长自动停止，不循环</div>
        </div>
        <div class="stepper"><div class="stepper-btn">−</div><div class="stepper-val">30</div><div class="stepper-btn">+</div><span class="stepper-unit">分钟</span></div>
      </div>
      <div style="border-top:1px solid #E2E8F0;margin:12px 0;"></div>
      <div class="switch-row"><span class="icon">🔇</span><span class="label">静音提醒</span><div class="toggle"></div></div>
      <div class="hint">到点只亮屏弹提醒，不响铃不震动</div>
      <div class="switch-row"><span class="icon">🔒</span><span class="label">锁定 L 分钟</span><div class="toggle"></div></div>
      <div class="hint">前 L 分钟不可停，到点出现关闭按钮</div>
    </div>
  </div>
  <div class="bottom">
    <div class="btn btn-cancel">取消</div>
    <div class="btn btn-save">保存任务</div>
  </div>
</div>
</body>
</html>
