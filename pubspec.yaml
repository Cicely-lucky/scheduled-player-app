name: scheduled_player_app
description: "定时播放 App：定时打开网址 / 定时播放音视频文件，支持循环播放与锁定时长"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 任务持久化
  shared_preferences: ^2.2.2
  # 精确闹钟调度（Android AlarmManager，准点触发、熄屏也唤醒）
  android_alarm_manager_plus: ^4.0.4
  # 全屏通知（到点弹出提醒，点击拉起 App 执行任务）
  flutter_local_notifications: ^17.2.2
  # 打开网址
  url_launcher: ^6.2.5
  # 音频播放（本地文件 / 网络流）
  just_audio: ^0.9.38
  # 视频播放
  video_player: ^2.8.3
  # 选择导入音视频文件
  file_picker: ^8.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
