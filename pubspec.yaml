name: scheduled_player_app
description: "定时播放 App：定时打开网址 / 定时播放音视频文件，支持循环播放与锁定时长"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 任务持久化
  shared_preferences: ^2.2.2
  # 后台定时调度（Android WorkManager，最小周期 15 分钟）
  workmanager: ^0.6.2
  # 打开网址
  url_launcher: ^6.2.5
  # 音频播放（本地文件 / 网络流）
  just_audio: ^0.9.38
  # 视频播放
  video_player: ^2.8.3
  # 选择导入音视频文件
  file_picker: ^8.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
